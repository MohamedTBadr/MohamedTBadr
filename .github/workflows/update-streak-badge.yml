name: Update GitHub Streak Badge

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:     # Allows manual trigger

jobs:
  streak-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch streak count
        id: streak
        run: |
          echo "Fetching GitHub streak including private contributions..."
          STREAK=$(curl -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -s https://api.github.com/users/MohamedTBadr/events | \
          jq '[.[] | select(.type=="PushEvent") | .created_at] | length')
          echo "streak=$STREAK" >> $GITHUB_OUTPUT

      - name: Update README badge
        run: |
          echo "Updating README badge..."
          sed -i "s|\[CURRENT_STREAK\]|${{ steps.streak.outputs.streak }}|g" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update streak badge [skip ci]" || echo "No changes to commit"
          git push
