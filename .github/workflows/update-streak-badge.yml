name: Update GitHub Streak Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  streak-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch contributions calendar
        id: contributions
        run: |
          echo "Fetching contributions calendar including private contributions..."
          CALENDAR=$(curl -s -H "Authorization: bearer ${{ secrets.GH_PAT }}" \
            -X POST -d '{"query":"query { user(login: \"MohamedTBadr\") { contributionsCollection { contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }"}' \
            https://api.github.com/graphql)
          echo "$CALENDAR" > contributions.json
          echo "Calendar fetched"

      - name: Calculate current streak
        id: streak
        run: |
          streak=0
          today=$(date +%Y-%m-%d)
          jq -r '.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | "\(.date) \(.contributionCount)"' contributions.json | tac | while read date count; do
            if [ "$count" -gt 0 ]; then
              streak=$((streak+1))
            else
              # Stop counting streak if today or previous day was empty
              if [ "$date" != "$today" ]; then
                break
              fi
            fi
          done
          echo "streak=$streak" >> $GITHUB_OUTPUT
          echo "Current streak: $streak"

      - name: Update README badge
        run: |
          echo "Updating README badge..."
          sed -i "s|\[CURRENT_STREAK\]|${{ steps.streak.outputs.streak }}|g" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update streak badge [skip ci]" || echo "No changes to commit"
          git push
