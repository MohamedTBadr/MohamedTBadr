name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 365-day activity graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: MohamedTBadr
        run: |
          python scripts/activity_graph.py

      - name: Publish graph to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save generated graph outside the current branch
          mkdir -p /tmp/activity-graph
          cp dist/activity-graph.svg /tmp/activity-graph/activity-graph.svg

          # Fetch output branch if it exists
          git fetch origin output:output || true

          # Remove generated files from current branch before switching
          rm -rf dist

          if git show-ref --verify --quiet refs/heads/output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

          # Keep output branch clean
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            -exec rm -rf {} +

          mkdir -p dist
          cp /tmp/activity-graph/activity-graph.svg dist/activity-graph.svg

          git add dist/activity-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update activity graph"
            git push origin output
          fi
